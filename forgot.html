<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Recuperar senha - São Paulo FC</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <div class="page__background"></div>
    <main class="card">
      <div class="brand">
        <img src="assets/crest.png.png" alt="Escudo São Paulo FC" class="brand__logo" />
        <h1>Recuperar senha</h1>
        <p class="brand__subtitle">Insira o e-mail cadastrado para receber instruções</p>
      </div>

      <form id="forgotForm" class="form" novalidate>
        <div class="field">
          <label for="forgotEmail">E-mail</label>
          <input id="forgotEmail" name="forgotEmail" type="email" placeholder="seu@exemplo.com" required />
          <span class="error-message"></span>
        </div>

        <button type="submit" class="btn btn--primary">Enviar instruções</button>
        <a href="index.html" class="link">Voltar ao login</a>
      </form>

      <div id="forgotResult" style="margin-top:14px"></div>
    </main>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
