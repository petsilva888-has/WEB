<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Redefinir senha - São Paulo FC</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <div class="page__background"></div>
    <main class="card">
      <div class="brand">
        <img src="assets/crest.png.png" alt="Escudo São Paulo FC" class="brand__logo" />
        <h1>Redefinir senha</h1>
        <p class="brand__subtitle">Escolha uma nova senha para sua conta</p>
      </div>

      <form id="resetForm" class="form" novalidate>
        <div class="field">
          <label for="newPassword">Nova senha</label>
          <div class="password-field">
            <input id="newPassword" name="newPassword" type="password" placeholder="••••••••" required />
            <button type="button" class="password-toggle">👁️</button>
          </div>
          <span class="error-message"></span>
        </div>

        <div class="field">
          <label for="confirmNewPassword">Confirmar nova senha</label>
          <div class="password-field">
            <input id="confirmNewPassword" name="confirmNewPassword" type="password" placeholder="••••••••" required />
            <button type="button" class="password-toggle">👁️</button>
          </div>
          <span class="error-message"></span>
        </div>

        <button type="submit" class="btn btn--primary">Redefinir senha</button>
        <a href="index.html" class="link">Voltar ao login</a>
      </form>

      <div id="resetResult" style="margin-top:14px"></div>
    </main>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
