<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - São Paulo FC</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page">
        <div class="page__background"></div>

        <main class="card">
            <div class="brand">
                <img src="assets/crest.png.png" alt="Escudo São Paulo FC" class="brand__logo" />
                <h1>São Paulo FC</h1>
                <p class="brand__subtitle">Crie sua conta torcedora</p>
            </div>

            <form id="registerForm" class="form" novalidate>
                <div class="field">
                    <label for="fullName">Nome completo</label>
                    <input id="fullName" name="fullName" type="text" placeholder="Seu nome completo" required />
                    <span class="error-message"></span>
                </div>

                <div class="field">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" placeholder="seu@exemplo.com" required />
                    <span class="error-message"></span>
                </div>

                <div class="field">
                    <label for="password">Senha</label>
                    <div class="password-field">
                        <input id="password" name="password" type="password" placeholder="••••••••" required />
                        <button type="button" class="password-toggle" aria-label="Mostrar ou ocultar senha">👁️</button>
                    </div>
                    <span class="error-message"></span>
                </div>

                <div class="field">
                    <label for="confirmPassword">Confirmar senha</label>
                    <div class="password-field">
                        <input id="confirmPassword" name="confirmPassword" type="password" placeholder="••••••••" required />
                        <button type="button" class="password-toggle" aria-label="Mostrar ou ocultar senha">👁️</button>
                    </div>
                    <span class="error-message"></span>
                </div>

                <button type="submit" class="btn btn--primary">Cadastrar</button>
                <a href="index.html" class="link">Já tenho uma conta</a>
            </form>
        </main>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
